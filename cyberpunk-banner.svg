<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Andres Mauricio Pidiache — Tecnología y gaming</title>
  <desc id="desc">Banner oscuro de estilo futurista con líneas de circuito verde neón y azul eléctrico, cuadrícula sutil y el nombre Andres Mauricio Pidiache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080B"/>
      <stop offset="53%" stop-color="#071A2F"/>
      <stop offset="100%" stop-color="#0B1F17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF88"/>
      <stop offset="55%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#79F7FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <path d="M720 -30L970 -30L690 390L440 390Z" fill="#00D9FF" opacity=".045"/>
    <path d="M930 -20L1030 -20L790 380L690 380Z" fill="#39FF88" opacity=".06"/>
    <path d="M0 70H188L220 102H354M0 286H122L154 254H270" stroke="#39FF88" stroke-width="2" stroke-opacity=".7" fill="none"/>
    <path d="M850 42H1000L1024 66H1200M886 318H1042L1074 286H1200" stroke="#38BDF8" stroke-width="2" stroke-opacity=".78" fill="none"/>
    <rect x="28" y="28" width="1144" height="304" rx="16" fill="#03070B" fill-opacity=".2" stroke="url(#accent)" stroke-opacity=".45"/>
    <path d="M58 112H246L266 92H328" stroke="#39FF88" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M832 266H930L954 242H1140" stroke="#38BDF8" stroke-width="2" fill="none" opacity=".8"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#A7F3D0">
      <text x="62" y="78">TECH / WEB / PLAY</text>
      <text x="930" y="78" fill="#7DD3FC">PLAYER 01</text>
    </g>
    <g filter="url(#glow)">
      <text x="62" y="174" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">ANDRES MAURICIO</text>
      <text x="62" y="232" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">PIDIACHE</text>
    </g>
    <rect x="64" y="251" width="380" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="64" y="286" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2" fill="#B8C7D9">DESARROLLO WEB  //  TECNOLOGÍA  //  GAMING</text>
    <!-- Abstract gaming controller outline -->
    <g transform="translate(850 112)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 34C33 34 25 45 19 63L6 112C1 130 13 142 29 134L68 109H152L191 134C207 142 219 130 214 112L201 63C195 45 187 34 170 34Z" fill="#07111D" stroke="url(#accent)" stroke-width="2.5"/>
      <path d="M45 66V98M29 82H61" stroke="#39FF88" stroke-width="6"/>
      <circle cx="157" cy="70" r="7" fill="#38BDF8" stroke="none"/>
      <circle cx="176" cy="88" r="7" fill="#39FF88" stroke="none"/>
      <circle cx="139" cy="88" r="7" fill="#F8FAFC" stroke="none" opacity=".9"/>
      <circle cx="157" cy="106" r="7" fill="#38BDF8" stroke="none"/>
      <path d="M80 63H140M92 76H128" stroke="#38BDF8" stroke-opacity=".65" stroke-width="2"/>
      <path d="M84 121L95 129H125L136 121" fill="none" stroke="#39FF88" stroke-opacity=".6" stroke-width="2"/>
    </g>
    <g fill="#39FF88"><circle cx="758" cy="102" r="3"/><circle cx="788" cy="132" r="2"/><circle cx="810" cy="96" r="2"/></g>
    <g fill="#38BDF8"><circle cx="1106" cy="178" r="3"/><circle cx="1080" cy="204" r="2"/><circle cx="1134" cy="226" r="2"/></g>
    <path d="M1090 298h42m-21 -21v42" stroke="#39FF88" stroke-width="1.5" stroke-opacity=".7"/>
  </g>
</svg>
